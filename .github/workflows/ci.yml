name: Satisium Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      run-audit:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip (dead code)
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Build (Zero-Key Boot)
        run: pnpm build

      - name: Security audit
        if: ${{ inputs.run-audit }}
        run: pnpm audit --audit-level=high
