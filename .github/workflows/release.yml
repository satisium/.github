name: Satisium Reusable Release

on:
  workflow_call:
    inputs:
      release-type:
        required: false
        type: string
        default: "node"
      target-branch:
        required: false
        type: string
        default: "main"
    secrets:
      release-token:
        required: false
    outputs:
      release_created:
        description: "Whether a new GitHub release was created"
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: "The git tag created for the release"
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: "The semantic version of the release"
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.release-token || github.token }}
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}
